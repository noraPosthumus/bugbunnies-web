---
title: BugBunnies - Team
---

<div id="team-member-list">
    {% for team_member in site.team_members %}
    <div class="card">
        <h3 class="card__title">
            {{ team_member.name }}
        </h3>
        <p class="card__content">
            {{ team_member.content | markdownify | strip_html }}
        </p>
        <a href="/writeups#{{ team_member.name }}" class="card__button">> Read {{ team_member.pronouns.genetive }}
            Writeups</a>
    </div>
    {% endfor %}

    <div id="js_security-radar" class="security-radar">
        <h3>
            Security Radar
        </h3>
        <svg id="radar" viewBox="0 0 200 200" width="200" height="200" stroke="#fff" filter="url(#red-glow)">
            <!-- Background Grid Circles -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="2" />
            <circle cx="100" cy="100" r="60" fill="none" stroke="#fff" stroke-width="2" />
            <circle cx="100" cy="100" r="30" fill="none" stroke="#fff" stroke-width="2" />

            <!-- Crosshairs -->
            <line x1="100" y1="0" x2="100" y2="200" stroke="#fff" stroke-width="2" />
            <line x1="0" y1="100" x2="200" y2="100" stroke="#fff" stroke-width="2" />

            <!-- Rotating Sweep Group -->
            <g id="sweep">
                <path d="M100 100 L190 100 A90 90 0 0 1 100 190 Z" fill="url(#sweepGradient)"/>
            </g>

            <!-- Gradient for sweep effect -->
            <defs>
                <radialGradient id="sweepGradient" cx="100" cy="100" r="90" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0" />
                </radialGradient>

                <filter id="red-glow" filterUnits="userSpaceOnUse" x="-50%" y="-50%" width="200%" height="200%">
                    <!-- blur the text at different levels-->
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur5" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur10" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur20" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur30" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="50" result="blur50" />
                    <!-- merge all the blurs except for the first one -->
                    <feMerge result="blur-merged">
                        <feMergeNode in="blur10" />
                        <feMergeNode in="blur20" />
                        <feMergeNode in="blur30" />
                        <feMergeNode in="blur50" />
                    </feMerge>
                    <feMerge>
                        <feMergeNode in="blur-merged" /> <!-- largest blurs coloured red -->
                        <feMergeNode in="blur5" /> <!-- smallest blur left white -->
                        <feMergeNode in="SourceGraphic" /> <!-- original white text -->
                    </feMerge>
                </filter>
            </defs>
        </svg>
        <style>
            #sweep {
                transform-origin: center;
                animation: spin 4s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <p id="js_security-radar__log" class="security-radar__log"></p>
    </div>
</div>
<script src="assets/js/plain-draggable.min.js"></script>
<script>
    let localUIState = getUIState();

    const cards = Array.from(document.getElementsByClassName('card'));
    const securityRadar = document.getElementById('js_security-radar');
    const securityLog = document.getElementById('js_security-radar__log');

    draggableSecurityRadar = new PlainDraggable(securityRadar);
    draggableSecurityRadar.containment = { left: 0, top: '10%', width: '100%', height: '85%' };
    draggableSecurityRadar.zIndex = false;

    securityRadar.style.zIndex = cards.length;

    draggableSecurityRadar.left = localUIState?.animationState?.securityRadarPosition?.left || window.innerWidth / 2 - 350;
    draggableSecurityRadar.top = localUIState?.animationState?.securityRadarPosition?.top || window.innerHeight / 2 - 410;
    securityRadar.style.zIndex = localUIState?.animationState?.securityRadarPosition?.zIndex || 0;

    draggableSecurityRadar.onDragStart = function () {
        cards.forEach(card => {
            if (this.element.style.zIndex < card.style.zIndex) {
                card.style.zIndex -= 1;
            }
        })
        this.element.style.zIndex = cards.length;
    };

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const radius = 500;
    const maxJitter = 80;


    const hasIntroAnimationPlayed = localUIState?.animationState?.introPlayed || false;

    const draggableCards = cards.map((card, i) => {
        card.style.opacity = 0;

        draggableCard = new PlainDraggable(card);
        draggableCard.containment = { left: 0, top: '10%', width: '100%', height: '85%' };
        draggableCard.zIndex = false;

        let x, y, zIndex;

        const angle = (2 * Math.PI / cards.length) * i;
        let color = "#9CFFAE";

        switch (i%4) {
            case 1:
                color = "#94C6FF";
                break;
            case 2:
                color = "#FFEB87";
                break;
            case 3:
                color = "#FF6755";
        }

        if (hasIntroAnimationPlayed && localUIState.animationState.cardPositions) {
            x = localUIState.animationState.cardPositions[i]?.left;
            y = localUIState.animationState.cardPositions[i]?.top;
            zIndex = localUIState.animationState.cardPositions[i]?.zIndex;

            detectThreat(color, x, y, angle);
        }

        if (!hasIntroAnimationPlayed || !x || !y || !zIndex) {

            console.log(i)

            x = centerX + radius * Math.cos(angle);
            y = centerY + radius * Math.sin(angle);

            y = Math.max(y, window.innerHeight * 0.2)
            y = Math.min(y, window.innerHeight * 0.85)

            x += (Math.random() - 0.5) * maxJitter * 2;
            y += (Math.random() - 0.5) * maxJitter * 2;

            const cardWidth = card.offsetWidth || 215;
            const cardHeight = card.offsetHeight || 85;

            x -= cardWidth / 2;
            y -= cardHeight / 2;

            zIndex = i + 1;

            setTimeout(() => {
                detectThreat(color, x, y, angle, card);
            }, i* 800 + 50);
        } else {
            card.classList.add('show');
        }

        draggableCard.left = x;
        draggableCard.top = y;

        card.style.zIndex = zIndex;

        draggableCard.onDragStart = function () {
            cards.forEach(card => {
                if (this.element.style.zIndex < card.style.zIndex) {
                    card.style.zIndex -= 1;
                }
            })
            if (this.element.style.zIndex < securityRadar.style.zIndex) {
                securityRadar.style.zIndex -= 1;
            }
            this.element.style.zIndex = cards.length;
        };

        return draggableCard;
    })

    if (!hasIntroAnimationPlayed) {
        setTimeout(() => {
            updateUIState('animationState', { "introPlayed": true });
        }, cards.length * 500)
    }

    window.addEventListener('beforeunload', () => {
        updateUIState("animationState", { "cardPositions": draggableCards.map(card => ({ top: card.top || 1, left: card.left || 1, zIndex: card.element.style.zIndex })) });
        updateUIState("animationState", { "securityRadarPosition": { top: draggableSecurityRadar.top || 1, left: draggableSecurityRadar.left || 1, zIndex: securityRadar.style.zIndex } });
    });

    function createBlip(x, y, color) {
        const svg = document.getElementById("radar");
        const blip = document.createElementNS("http://www.w3.org/2000/svg", "circle");

        blip.setAttribute("cx", x);
        blip.setAttribute("cy", y);
        blip.setAttribute("r", 5);
        blip.setAttribute("fill", color);
        blip.classList.add("blip");

        svg.appendChild(blip);
    }

    function detectThreat(color, x, y, angle, card=undefined) {
        x = 100 + (Math.abs(x - window.innerWidth * 0.5) / (window.innerWidth * 0.5)) * 90 * Math.cos(angle);
        y = 100 + (Math.abs(y - window.innerHeight * 0.5) / (window.innerHeight * 0.5)) * 90 * Math.sin(angle);
        createBlip(x, y, color);
        if(card) {
            card.classList.add('show');
        }
        const securityAlert = document.createElement('p');
        securityAlert.innerText = "> Threat detected!";
        securityLog.appendChild(securityAlert);
    }
</script>
